[project]
name = "mytime"
version = "0.1.0"
description = "Single-user time tracking and billing app for solo consultants"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
