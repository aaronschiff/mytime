{% extends "base.html" %}
{% block title %}{{ client.name }} — mytime{% endblock %}
{% block content %}
<h1>{{ client.name }}</h1>
<p>
  <form method="get" action="/clients/{{ client.id }}/edit" style="display:inline">
    <button>Edit</button>
  </form>
  <a href="/projects/new?from_page=/clients/{{ client.id }}">+ New project</a>
</p>
<table>
  <thead><tr><th>Project</th><th>Rate</th><th>Status</th><th></th></tr></thead>
  <tbody>
  {% for p in projects %}
    <tr>
      <td><a href="/projects/{{ p.id }}">{{ p.name }}</a></td>
      <td>{{ p.hourly_rate | money(currency) }}</td>
      <td>{{ p.status }}</td>
      <td>
        <form method="get" action="/projects/{{ p.id }}/edit" style="display:inline">
          <input type="hidden" name="from_page" value="/clients/{{ client.id }}">
          <button>Edit</button>
        </form>
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
