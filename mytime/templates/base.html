<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}mytime{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css?v={{ static_version('app.css') }}">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="icon" href="/static/icons/favicon.png" type="image/png">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="mytime">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <nav class="topnav">
    <input type="checkbox" id="nav-toggle" class="nav-toggle" hidden>
    <button type="button" class="back-btn" onclick="history.back()" aria-label="Back">←</button>
    <label for="nav-toggle" class="nav-toggle-btn" aria-label="Menu">☰</label>
    <div class="nav-links">
      <a href="/today">Today</a>
      <a href="/">Overview</a>
      <a href="/projects">Projects</a>
      <a href="/time">Time</a>
      <a href="/clients">Clients</a>
      <a href="/invoices">Invoices</a>
      <a href="/settings">Settings</a>
    </div>
  </nav>
  <main>{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
  <div id="error-toast"></div>
  <script>
  (function() {
    var toast = document.getElementById('error-toast');
    var _timer = null;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(_timer);
      _timer = setTimeout(function() { toast.classList.remove('show'); }, 4000);
    }
    document.body.addEventListener('htmx:sendError', function() {
      showToast('Could not reach server — check your connection');
    });
    document.body.addEventListener('htmx:responseError', function() {
      showToast('Server error — please try again');
    });
  })();
  </script>
</body>
</html>
