{% extends "base.html" %}
{% block title %}Settings — mytime{% endblock %}
{% block content %}
<h1>Settings</h1>

<section>
  <h2>Defaults</h2>
  <form method="post" action="/settings">
    <p><label>Default hourly rate<br>
      <input type="number" step="1" name="default_hourly_rate"
             value="{{ settings.default_hourly_rate | int }}" style="width:8em">
    </label></p>
    <p><label>Currency symbol<br>
      <input type="text" name="currency_symbol" maxlength="8" value="{{ settings.currency_symbol }}" style="width:5em">
    </label></p>
    <p><label>Default GST rate (%) — leave blank if not applicable<br>
      <input type="number" step="0.1" name="default_gst_rate"
             value="{{ settings.default_gst_rate if settings.default_gst_rate is not none else '' }}"
             placeholder="e.g. 15" style="width:8em">
    </label></p>
    <button type="submit" class="btn-save">Save</button>
  </form>
</section>

<section>
  <h2>Task types</h2>
  <table class="responsive">
    <thead><tr><th>Name</th><th>Status</th><th></th></tr></thead>
    <tbody>
    {% for t in task_types %}
      <tr>
        <td data-label="Name">
          <form id="rename-form-{{ t.id }}" class="rename-form" method="post" action="/settings/task-types/{{ t.id }}/rename" style="display:inline">
            <input type="text" name="name" value="{{ t.name }}">
          </form>
        </td>
        <td data-label="Status">{{ "Active" if t.active else "Retired" }}</td>
        <td class="actions">
          <button type="submit" form="rename-form-{{ t.id }}">Rename</button>
          <form method="post" action="/settings/task-types/{{ t.id }}/active" style="display:inline">
            <input type="hidden" name="active" value="{{ 0 if t.active else 1 }}">
            <button type="submit">{{ "Retire" if t.active else "Reactivate" }}</button>
          </form>
        </td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
  <form method="post" action="/settings/task-types">
    <input type="text" name="name" placeholder="New task type" required>
    <button type="submit">Add</button>
  </form>
</section>

<section>
  <h2>Export data</h2>
  <p>Download all time entries as a CSV file.</p>
  <form method="get" action="/settings/export">
    <button type="submit" class="btn-save">Export CSV</button>
  </form>
</section>
{% endblock %}
