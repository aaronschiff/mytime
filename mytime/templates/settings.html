{% extends "base.html" %}
{% block title %}Settings — mytime{% endblock %}
{% block content %}
<h1>Settings</h1>

<section>
  <h2>Defaults</h2>
  <form method="post" action="/settings">
    <label>Default hourly rate
      <input type="number" step="0.01" name="default_hourly_rate"
             value="{{ '%.2f'|format(settings.default_hourly_rate) }}">
    </label>
    <label>Currency symbol
      <input type="text" name="currency_symbol" maxlength="8" value="{{ settings.currency_symbol }}">
    </label>
    <button type="submit">Save</button>
  </form>
</section>

<section>
  <h2>Task types</h2>
  <table>
    <thead><tr><th>Name</th><th>Status</th><th></th></tr></thead>
    <tbody>
    {% for t in task_types %}
      <tr>
        <td>
          <form method="post" action="/settings/task-types/{{ t.id }}/rename" style="display:inline">
            <input type="text" name="name" value="{{ t.name }}">
            <button type="submit">Rename</button>
          </form>
        </td>
        <td>{{ "Active" if t.active else "Retired" }}</td>
        <td>
          <form method="post" action="/settings/task-types/{{ t.id }}/active" style="display:inline">
            <input type="hidden" name="active" value="{{ 0 if t.active else 1 }}">
            <button type="submit">{{ "Retire" if t.active else "Reactivate" }}</button>
          </form>
        </td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
  <form method="post" action="/settings/task-types">
    <input type="text" name="name" placeholder="New task type" required>
    <button type="submit">Add</button>
  </form>
</section>
{% endblock %}
