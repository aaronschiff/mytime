<h2>Time entries</h2>
<p><a href="/time/new">+ New time entry</a></p>
<table>
  <thead><tr><th>Date</th><th>Task</th><th>Time</th><th>Notes</th></tr></thead>
  <tbody>
  {% for e in entries %}
    <tr class="{{ 'locked' if e.invoice_id }}">
      <td>{{ e.entry_date }}</td><td>{{ task_names[e.task_type_id] }}</td>
      <td>{{ e.seconds | hm }}</td><td>{{ e.notes or "" }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>
